# Minimal developer shell: a few cargo tools plus zsh/bash snippets.
# A good starting point for your own manifest:
#
#   swiss init-config --template dev-shell --output bootstrap.yaml
#   swiss plan  --manifest bootstrap.yaml
#   swiss apply --manifest bootstrap.yaml

dependencies:
  cargo:
    cargo-binstall:
    ripgrep:
    bat:
    zoxide:
    starship:

files:
  - content: |
      add_newline = false
    dest: ~/.config/starship.toml
    overwrite: false

shells:
  zsh:
    enabled: true
    mode: snippet
    target: ~/.zshrc
    modules:
      - path
      - aliases
      - starship
      - zoxide
  bash:
    enabled: false
    mode: snippet
    target: ~/.bashrc
    modules:
      - path
      - aliases
      - starship
      - zoxide

shell_modules:
  path:
    env:
      PATH:
        prepend:
          - ~/.cargo/bin
          - ~/.local/bin
  aliases:
    aliases:
      ll: "ls -la"
      gs: "git status"
  starship:
    package: starship
    init:
      zsh: eval "$(starship init zsh)"
      bash: eval "$(starship init bash)"
  zoxide:
    package: zoxide
    init:
      zsh: eval "$(zoxide init zsh)"
      bash: eval "$(zoxide init bash)"
