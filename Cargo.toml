[package]
name = "swiss"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0.31"
serde = { version = "1.0.138", features = ["derive"] }
serde_yaml = { version = "0.9.14" }
clap = { version = "4.0.26", features = ["derive"] }
rkyv = { version = "0.7.39", features = ["bytecheck"] }
bytecheck = "0.6.8"
home = "0.5.3"
env_logger = "0.9.0"
log = "0.4.17"
colored = "2.0.0"
syntect = "5.0.0"
anyhow = "1.0.66"

[dev-dependencies]
indoc = "1.0.6"
