[package]
name = "swiss"
version = "1.0.3+alpha.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0.48"
serde = { version = "1.0.188", features = ["derive"] }
serde_yaml = { version = "0.9.25" }
clap = { version = "4.4.2", features = ["derive"] }
rkyv = { version = "0.7.42", features = ["bytecheck", "validation"] }
bytecheck = "0.6.12"
home = "0.5.5"
env_logger = "0.11.2"
log = "0.4.20"
colored = "2.0.4"
syntect = "5.1.0"
anyhow = "1.0.75"
lazy_static = "1.4.0"

[dev-dependencies]
indoc = "2.0.3"
tempfile = "3.10"
