dependencies:
  cargo:
    # PENDING:
    # https://github.com/emilk/egui
    # https://github.com/copy/v86
    # https://github.com/babysor/MockingBird
    cargo-watch:
    cargo-update:
    cargo-edit:
    cargo-cache:
    cargo-deps:
    find-files:
    ripgrep:
    watchexec-cli:
      alias:
        wexec: "watchexec"
    hexyl:
    czkawka_cli:
    dua-cli:
    bottom:
    zoxide:
      alias:
        cdi: "__zoxide_zi"
        cd: "__zoxide_z"
    bat:
    procs:
    sd:
    tokei:
    hyperfine:
    tealdeer:
      commands:
        - "tldr --update"
    bandwhich:
    grex:
    git-delta: # TODO: this dependency needs to perform some update in filesystem
      commands:
        - "git config --global core.pager delta"
        - "git config --global interactive.diffFilter \"delta --color-only --features=interactive\""
    fnm:
    websocat:
    gitui:
    zellij:
      alias:
        zj: "zellij"
      windows: false
    exa:
      alias:
        els: "exa --long --sort=size"
      windows: false
    rmesg:
      windows: false
    genact:
  customs:
    starship:
      post-install:
        linux:
          - "curl -sS https://starship.rs/install.sh | sh"
        macos:
          - "curl -sS https://starship.rs/install.sh | sh"

    helix:
      git:
        repo: "https://github.com/helix-editor/helix"
        branch: "master"
      install:
        - "cargo install --path helix-term"
        - "hx --grammar fetch"
        - "hx --grammar build"
      post-install:
        linux: # if macos not defined consumes linux
          - "ln -s (echo $env.PWD \"/runtime\" | str collect )  ~/.config/helix/runtime"
        windows:
          - "mklink /D \"%APPDATA%\\Helix\\runtime\" (echo $env.PWD \"\\runtime\" | str collect )"
      uninstall:
        - "cargo uninstall --path helix-term"
    wezterm:
      git:
        repo: "https://github.com/wez/wezterm"
        branch: "main"
        depth: 1
        recursive: true
      install:
        # TODO: command to run - "git clone --depth=1 --branch=main --recursive https://github.com/wez/wezterm.git"
        # TODO: Handled in recursive git repo - "git submodule update --init --recursive"
        - "./get-deps"
        - "cargo build --release"
        # - "cargo install --path ./wezterm"
      post-install:
        linux:
          - "cd target/release; ls -l | where $it.mode =~ x && $it.type != dir | each { |$it| cp $it.name /usr/local/bin }"
      pre-uninstall:
        linux:
          - "cd target/release; ls -l | where $it.mode =~ x && $it.type != dir | each { |$it| rm (echo /usr/local/bin/ $it.name | str collect) }"
      windows: false
      macos: false
rust:
  # components needs to install with `rustup components add $item`
  components:
    - rust-analyzer
  toolchain: "nightly"
  # rust needs to be downloaded and then call binary with `-y` argument
  # No yaml required
  installer:
    linux: 'curl https://sh.rustup.rs -sSf | sh -s -- -y'
    macos: 'curl https://sh.rustup.rs -sSf | sh -s -- -y'
    windows: 'TODO: Add nu script'
package-manager:
  packages:
    - fzf
  linux:
    apt:
      packages:
        - build-essential
        - libssl-dev
        - pkg-config
        - docker.io
        - net-tools
        - libglibd-2.0-dev
        - libx11-dev
      remove: "uninstall"
  windows:
    scoop:
      packages:
        - libssl-dev
  macos:
    brew:
      packages:
        - cmake
      install: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
nushell:
  version: "0.74.0"